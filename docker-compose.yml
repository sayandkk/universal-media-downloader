services:
  mediaflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediaflow-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

